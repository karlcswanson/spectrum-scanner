version: 2

project_name: spectrum-scanner

before:
  hooks:
    - cd scanner && go mod tidy

builds:
  - id: scanner
    dir: scanner
    main: ./cmd/scanner
    binary: spectrum-scanner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: desktop
    dir: scanner
    main: ./cmd/desktop
    binary: spectrum-desktop
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - desktop

universal_binaries:
  - id: scanner
    replace: true
  - id: desktop
    replace: true

archives:
  - ids:
      - scanner
      - desktop
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - src: scanner/config.example.yaml
        dst: .

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: karlcswanson
    name: spectrum-pluto
  draft: false
  prerelease: auto
