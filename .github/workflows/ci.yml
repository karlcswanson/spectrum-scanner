name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The scanner binary embeds internal/api/web (the standalone build), which
      # is gitignored — build it so `go vet`/`go test` can compile the embed.
      - name: Build embedded frontend
        run: npm ci && (cd ../scanner && make build-frontend)
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: scanner/go.sum
      - run: go vet ./...
        working-directory: scanner
      - run: go test ./...
        working-directory: scanner

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spectrum
          POSTGRES_PASSWORD: spectrum
          POSTGRES_DB: spectrum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spectrum"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: spectrum
      DB_USER: spectrum
      DB_PASSWORD: spectrum
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: server
      - run: uv run python manage.py check
        working-directory: server
      - run: uv run python manage.py test
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
