name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The scanner binary embeds internal/api/web (the standalone build), which
      # is gitignored — build it so `go vet`/`go test` can compile the embed.
      - name: Build embedded frontend
        run: npm ci && (cd ../scanner && make build-frontend)
        working-directory: frontend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: scanner/go.sum
      - run: go vet ./...
        working-directory: scanner
      - run: go test ./...
        working-directory: scanner

  server:
    runs-on: ubuntu-latest
    # Tests run on the SQLite default (all array data is JSONField, no
    # Postgres-specific fields) — no DB service needed, faster and cheaper.
    env:
      DJANGO_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
        working-directory: server
      - run: uv run python manage.py check
        working-directory: server
      - run: uv run python manage.py test
        working-directory: server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
