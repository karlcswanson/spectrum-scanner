# Spectrum Scanner Configuration

# Auto-start scanning when the scanner boots
auto_start: true

# Scan settings
dwell_time_ms: 200
mode: Average  # Average or PeakDetect

# Gain settings
# Use manual mode for consistent sweeps across the spectrum
rx_gain: 40           # RX gain in dB (0-73)
rx_gain_mode: Manual  # manual, slow_attack, or fast_attack

# Frequency bands to scan
# Each band can be enabled/disabled independently
bands:
  - name: Business Radio
    start_mhz: 450
    stop_mhz: 470
    enabled: true

  - name: UHF
    start_mhz: 470
    stop_mhz: 608
    enabled: true

  - name: DECT
    start_mhz: 1920
    stop_mhz: 1930
    enabled: true

  - name: WiFi 2.4
    start_mhz: 2400
    stop_mhz: 2500
    enabled: true

  - name: WiFi 5
    start_mhz: 5150
    stop_mhz: 5850
    enabled: false

# Add custom bands as needed:
#  - name: ISM 900
#    start_mhz: 902
#    stop_mhz: 928
#    enabled: false

# MQTT publishing (optional)
# Uncomment to enable publishing scan data to a central server
mqtt:
  enabled: true
  broker: "tcp://localhost:1883"
  # Scanner credentials (get these from Django admin after creating the scanner)

  id: "d2572519-4dc7-4dfe-8780-da83bfb8c4cd"
  token: "fQWii2C4jvhN_w0R4owQACmL1vO54Wll0PJE7LTanfM"
  # Display info
  name: "Dev Scanner"      # Human-readable name (e.g., "Studio A Scanner")
  location: "Lititz PA"    # Physical location (e.g., "Studio A", "Main Stage")