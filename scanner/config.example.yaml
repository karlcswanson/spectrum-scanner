device_id: ""  # Auto-generated on first run
name: My Scanner
description: Spectrum Scanner
bands:
  - name: Business Radio
    start_mhz: 450
    stop_mhz: 470
    enabled: true
  - name: UHF
    start_mhz: 470
    stop_mhz: 608
    enabled: true
  - name: DECT
    start_mhz: 1920
    stop_mhz: 1930
    enabled: false
