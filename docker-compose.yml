version: '3.8'

services:
  # MQTT Broker with Django auth
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    depends_on:
      server:
        condition: service_started

  # Django Backend (REST API for historical data + MQTT auth)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DJANGO_SECRET_KEY=dev-secret-change-me
      - MQTT_BROKER_HOST=mosquitto
      - DB_ENGINE=django.db.backends.sqlite3
      - DB_NAME=/app/data/db.sqlite3
      - MQTT_BRIDGE_USERNAME=spectrum-bridge
      - MQTT_BRIDGE_PASSWORD=bridge-secret-token-change-me
    volumes:
      - ./server:/app
      - server_data:/app/data
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # MQTT Bridge (stores scans to database)
  mqtt-bridge:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - DB_ENGINE=django.db.backends.sqlite3
      - DB_NAME=/app/data/db.sqlite3
      - MQTT_BRIDGE_USERNAME=spectrum-bridge
      - MQTT_BRIDGE_PASSWORD=bridge-secret-token-change-me
    volumes:
      - ./server:/app
      - server_data:/app/data
    depends_on:
      - mosquitto
      - server
    command: python manage.py mqtt_bridge

  # Vue Frontend (dev server)
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - DOCKER_ENV=true
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  mosquitto_data:
  mosquitto_log:
  server_data:
  frontend_modules:
