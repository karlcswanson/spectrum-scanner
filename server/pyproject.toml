[project]
name = "spectrum-server"
version = "0.1.0"
description = "Central server for Spectrum Scanner fleet management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework>=3.14",
    "django-cors-headers>=4.3",
    "paho-mqtt>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "python-dateutil>=2.8",
    "gunicorn>=21.0",
    "numpy>=2.0",
    "apscheduler>=3.10,<4",
]
