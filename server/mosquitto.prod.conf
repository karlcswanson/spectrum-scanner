# Production MQTT Configuration for Spectrum Scanner

# Publish broker $SYS stats every 10s (client counts, message rates) for
# demo-day monitoring.
sys_interval 10

# MQTT listener (scanners connect here). Few scanners; cap modestly.
listener 1883
persistence true
persistence_location /mosquitto/data/
max_connections 200

# WebSocket listener (browser clients via Caddy proxy). Capped so a flood of
# public viewers can't exhaust broker memory; sized for a launch spike (~800
# concurrent) with headroom. Each connection is a few tens of KB of broker RAM
# plus one file descriptor — see the mosquitto service's `ulimits: nofile` in
# docker-compose.prod.yml, which must be >= this or the OS fd cap bites first.
listener 9001
protocol websockets
max_connections 1500

allow_anonymous false

# Dynamic Security Plugin (replaces mosquitto-go-auth)
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
