# Production MQTT Configuration for Spectrum Scanner
# This config is used in docker-compose.prod.yml

# MQTT listener (scanners connect here)
listener 1883
persistence true
persistence_location /mosquitto/data/

# WebSocket listener (browser clients via Caddy proxy)
listener 9001
protocol websockets

# Require authentication (no anonymous)
allow_anonymous false

# HTTP Auth Plugin (mosquitto-go-auth)
auth_plugin /mosquitto/go-auth.so

# HTTP backend only - all auth goes through Django
auth_opt_backends http
auth_opt_disable_superuser true

# HTTP backend config - forwards auth to Django
auth_opt_http_host server
auth_opt_http_port 8000
auth_opt_http_getuser_uri /api/auth/mqtt/
auth_opt_http_aclcheck_uri /api/auth/mqtt/acl/
auth_opt_http_with_tls false
auth_opt_http_response_mode status
auth_opt_http_params_mode form

# Cache auth results to reduce Django load
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 300
auth_opt_acl_cache_seconds 300

# Logging (less verbose for production)
auth_opt_log_level warn
