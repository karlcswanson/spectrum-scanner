services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-spectrum}
      - POSTGRES_USER=${DB_USER:-spectrum}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-spectrum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spectrum} -d ${DB_NAME:-spectrum}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MQTT Broker with Django auth
  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    depends_on:
      server:
        condition: service_started

  # Django Backend (REST API for historical data + MQTT auth)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-true}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-secret-change-me}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:-spectrum}
      - DB_HOST=postgres
      - DB_PORT=5432
      - MQTT_BRIDGE_USERNAME=${MQTT_BRIDGE_USERNAME:-spectrum-bridge}
      - MQTT_BRIDGE_PASSWORD=${MQTT_BRIDGE_PASSWORD:-bridge-secret-token-change-me}
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"

  # MQTT Bridge (stores scans to database)
  mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:-spectrum}
      - DB_HOST=postgres
      - DB_PORT=5432
      - MQTT_BRIDGE_USERNAME=${MQTT_BRIDGE_USERNAME:-spectrum-bridge}
      - MQTT_BRIDGE_PASSWORD=${MQTT_BRIDGE_PASSWORD:-bridge-secret-token-change-me}
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - mosquitto
      - server
    command: python manage.py mqtt_bridge

  # Scheduler (per-scanner rollup via APScheduler)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:-spectrum}
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - .:/app
    depends_on:
      - server
    command: uv run python manage.py scheduler

  # Vue Frontend (dev server)
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5174:5173"
    environment:
      - DOCKER_ENV=true
    volumes:
      - ../frontend:/app
      - frontend_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  frontend_modules:
