# Production Docker Compose for Spectrum Scanner
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-spectrum}
      - POSTGRES_USER=${DB_USER:-spectrum}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spectrum} -d ${DB_NAME:-spectrum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caddy - Reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - django_static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  # MQTT Broker with Django auth
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      # WebSocket exposed through Caddy, not directly
    volumes:
      - ./mosquitto.prod.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    depends_on:
      server:
        condition: service_started

  # Django Backend (REST API + MQTT auth)
  server:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-false}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost}
      - MQTT_BROKER_HOST=mosquitto
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - MQTT_BRIDGE_USERNAME=${MQTT_BRIDGE_USERNAME:-spectrum-bridge}
      - MQTT_BRIDGE_PASSWORD=${MQTT_BRIDGE_PASSWORD:?Set MQTT_BRIDGE_PASSWORD in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - server_data:/app/data
      - django_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MQTT Bridge (stores scans to database)
  mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - MQTT_BRIDGE_USERNAME=${MQTT_BRIDGE_USERNAME:-spectrum-bridge}
      - MQTT_BRIDGE_PASSWORD=${MQTT_BRIDGE_PASSWORD:?Set MQTT_BRIDGE_PASSWORD in .env}
    volumes:
      - server_data:/app/data
    depends_on:
      mosquitto:
        condition: service_started
      server:
        condition: service_healthy
    entrypoint: ["uv", "run", "python", "manage.py", "mqtt_bridge"]

  # Scheduler (per-scanner rollup + periodic dynsec sync via APScheduler)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-spectrum}
      - DB_USER=${DB_USER:-spectrum}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - MQTT_BROKER_HOST=mosquitto
      - MOSQUITTO_DYNSEC_USERNAME=${MOSQUITTO_DYNSEC_USERNAME:-admin}
      - MOSQUITTO_DYNSEC_PASSWORD=${MOSQUITTO_DYNSEC_PASSWORD:?Set MOSQUITTO_DYNSEC_PASSWORD in .env}
    volumes:
      - server_data:/app/data
    depends_on:
      server:
        condition: service_healthy
      mosquitto:
        condition: service_started
    entrypoint: ["uv", "run", "python", "manage.py", "scheduler"]

  # Frontend build (runs once, copies static files to volume)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/srv/frontend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  server_data:
  frontend_dist:
  django_static:
  caddy_data:
  caddy_config:
