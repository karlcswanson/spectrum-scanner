<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectrum Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #00d4ff; }
        .status-card {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            margin-top: 20px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #0f3460;
        }
        .status-row:last-child { border-bottom: none; }
        .label { color: #888; }
        .value { font-weight: bold; }
        .online { color: #00ff88; }
        .offline { color: #ff4444; }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-start { background: #00d4ff; color: #000; }
        .btn-start:hover { background: #00a8cc; }
        .btn-stop { background: #ff4444; color: #fff; }
        .btn-stop:hover { background: #cc3333; }
        .btn-export { background: #00ff88; color: #000; }
        .btn-export:hover { background: #00cc6a; }
        .btn-disabled { background: #444; color: #888; cursor: not-allowed; }
        #spectrum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .spectrum-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }
        .spectrum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .spectrum-header h3 { color: #00d4ff; font-size: 16px; }
        .spectrum-header .scan-info { color: #888; font-size: 12px; }
        .spectrum-canvas {
            width: 100%;
            height: 300px;
            background: #0a0a1a;
            border-radius: 4px;
        }
        .no-bands-msg {
            background: #16213e;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
        .log {
            background: #0a0a1a;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { padding: 2px 0; }
        .log-time { color: #666; }
        .band-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .band-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #0f3460;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .band-item:hover { background: #1a4a7a; }
        .band-item.enabled { background: #0a4a3a; border: 1px solid #00ff88; }
        .band-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00ff88;
        }
        .band-name { font-weight: bold; color: #eee; }
        .band-range { font-size: 12px; color: #888; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spectrum Scanner</h1>

        <div class="status-card">
            <div class="status-row">
                <span class="label">Status</span>
                <span class="value" id="status">Connecting...</span>
            </div>
            <div class="status-row">
                <span class="label">Scanner</span>
                <span class="value" id="scanning">--</span>
            </div>
            <div class="status-row">
                <span class="label">Current Band</span>
                <span class="value" id="current-band">--</span>
            </div>
            <div class="status-row">
                <span class="label">Device ID</span>
                <span class="value" id="device-id">--</span>
            </div>

            <div class="controls">
                <button id="btn-start" class="btn-start" onclick="startScan()">Start Scan</button>
                <button id="btn-stop" class="btn-stop btn-disabled" onclick="stopScan()" disabled>Stop Scan</button>
                <button id="btn-export" class="btn-export" onclick="exportCSV()">Export CSV</button>
            </div>
        </div>

        <div class="status-card">
            <h3 style="color: #00d4ff; margin-bottom: 15px;">Bands</h3>
            <div id="band-checkboxes" class="band-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <div id="spectrum-grid">
            <!-- Dynamically populated with one panel per enabled band -->
        </div>

        <div class="status-card">
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let scannerName = 'spectrum-scan';
        let bands = [];
        let bandScans = {};  // { bandName: lastScanData }
        let bandCanvases = {};  // { bandName: { canvas, ctx } }

        function log(msg) {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div class="log-entry"><span class="log-time">${time}</span> ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function fetchBands() {
            try {
                const resp = await fetch('/api/bands');
                bands = await resp.json();
                renderBandCheckboxes();
                renderSpectrumGrid();
            } catch (e) {
                log('Error fetching bands: ' + e.message);
            }
        }

        function renderBandCheckboxes() {
            const container = document.getElementById('band-checkboxes');
            container.innerHTML = bands.map((band, idx) => {
                const startMHz = (band.start_hz / 1e6).toFixed(0);
                const stopMHz = (band.stop_hz / 1e6).toFixed(0);
                return `
                    <label class="band-item ${band.enabled ? 'enabled' : ''}">
                        <input type="checkbox" ${band.enabled ? 'checked' : ''} onchange="toggleBand(${idx})">
                        <span class="band-name">${band.name}</span>
                        <span class="band-range">${startMHz}-${stopMHz} MHz</span>
                    </label>
                `;
            }).join('');
        }

        async function toggleBand(idx) {
            bands[idx].enabled = !bands[idx].enabled;
            renderBandCheckboxes();
            renderSpectrumGrid();

            try {
                await fetch('/api/bands', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bands)
                });
                const enabledBands = bands.filter(b => b.enabled).map(b => b.name).join(', ');
                log('Bands updated: ' + (enabledBands || 'none'));
            } catch (e) {
                log('Error updating bands: ' + e.message);
            }
        }

        function renderSpectrumGrid() {
            const grid = document.getElementById('spectrum-grid');
            const enabledBands = bands.filter(b => b.enabled);

            if (enabledBands.length === 0) {
                grid.innerHTML = '<div class="no-bands-msg">No bands enabled. Select bands above to start scanning.</div>';
                bandCanvases = {};
                return;
            }

            grid.innerHTML = enabledBands.map(band => {
                const startMHz = (band.start_hz / 1e6).toFixed(0);
                const stopMHz = (band.stop_hz / 1e6).toFixed(0);
                const canvasId = `canvas-${band.name.replace(/\s+/g, '-')}`;
                return `
                    <div class="spectrum-panel" data-band="${band.name}">
                        <div class="spectrum-header">
                            <h3>${band.name} <span style="font-weight: normal; color: #888;">(${startMHz}-${stopMHz} MHz)</span></h3>
                            <span class="scan-info" id="info-${band.name.replace(/\s+/g, '-')}">--</span>
                        </div>
                        <canvas class="spectrum-canvas" id="${canvasId}"></canvas>
                    </div>
                `;
            }).join('');

            // Initialize canvases
            bandCanvases = {};
            enabledBands.forEach(band => {
                const canvasId = `canvas-${band.name.replace(/\s+/g, '-')}`;
                const canvas = document.getElementById(canvasId);
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    const rect = canvas.getBoundingClientRect();
                    const dpr = window.devicePixelRatio || 1;
                    canvas.width = rect.width * dpr;
                    canvas.height = rect.height * dpr;
                    ctx.scale(dpr, dpr);
                    bandCanvases[band.name] = { canvas, ctx, band };
                    drawSpectrumOnCanvas(ctx, canvas, { power: [] }, band);
                }
            });
        }

        async function fetchStatus() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                scannerName = data.name || 'spectrum-scan';
                document.getElementById('status').innerHTML =
                    `<span class="${data.online ? 'online' : 'offline'}">${data.online ? 'Online' : 'Offline'}</span>`;
                document.getElementById('scanning').textContent = data.scanning ? 'Running' : 'Stopped';
                document.getElementById('current-band').textContent = data.current_band || '--';
                document.getElementById('device-id').textContent = data.id || '--';

                document.getElementById('btn-start').disabled = data.scanning;
                document.getElementById('btn-stop').disabled = !data.scanning;
                document.getElementById('btn-start').className = data.scanning ? 'btn-start btn-disabled' : 'btn-start';
                document.getElementById('btn-stop').className = data.scanning ? 'btn-stop' : 'btn-stop btn-disabled';
            } catch (e) {
                document.getElementById('status').innerHTML = '<span class="offline">Disconnected</span>';
            }
        }

        async function fetchRadioInfo() {
            try {
                const resp = await fetch('/api/radio');
                if (!resp.ok) {
                    log('Radio: not connected');
                    return;
                }
                const info = await resp.json();
                log(`Radio: ${info.sample_rate_mhz.toFixed(2)} MHz sample rate, ${(info.bin_size_hz/1000).toFixed(2)} kHz/bin, ${info.usable_bandwidth_mhz.toFixed(2)} MHz usable BW`);
                log(`Radio: RX gain ${info.rx_gain_db.toFixed(1)} dB (${info.rx_gain_mode}), FFT ${info.fft_size} bins`);
            } catch (e) {
                log('Radio: error fetching info');
            }
        }

        async function startScan() {
            try {
                await fetch('/api/scan/start', { method: 'POST' });
                log('Scan started');
                fetchRadioInfo();
                fetchStatus();
                connectWebSocket();
            } catch (e) {
                log('Error starting scan: ' + e.message);
            }
        }

        async function stopScan() {
            try {
                await fetch('/api/scan/stop', { method: 'POST' });
                log('Scan stopped');
                fetchStatus();
            } catch (e) {
                log('Error stopping scan: ' + e.message);
            }
        }

        function generateCSV(scan) {
            if (!scan || !scan.power) return '';

            let csv = 'Frequency (MHz),Power (dBm)\n';
            const startMHz = scan.hz_lo / 1e6;
            const stepMHz = scan.step / 1e6;

            for (let i = 0; i < scan.power.length; i++) {
                const freq = startMHz + (i * stepMHz);
                csv += `${freq.toFixed(6)},${scan.power[i].toFixed(2)}\n`;
            }
            return csv;
        }

        function exportCSV() {
            const scansToExport = Object.entries(bandScans);
            if (scansToExport.length === 0) {
                log('No scan data to export');
                return;
            }

            // Export each band as a separate file
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);

            scansToExport.forEach(([bandName, scan]) => {
                const csv = generateCSV(scan);
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);

                const filename = `${scannerName.replace(/\s+/g, '-')}_${bandName.replace(/\s+/g, '-')}_${timestamp}.csv`;

                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();

                URL.revokeObjectURL(url);
                log(`Exported: ${filename}`);
            });
        }

        function findBandForScan(scan) {
            // Match scan to band by frequency range
            for (const band of bands) {
                if (band.enabled &&
                    Math.abs(scan.hz_lo - band.start_hz) < 1e6 &&
                    Math.abs(scan.hz_hi - band.stop_hz) < 1e6) {
                    return band.name;
                }
            }
            return null;
        }

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/stream`);

            ws.onopen = () => {
                log('WebSocket connected');
            };

            ws.onmessage = (event) => {
                const scan = JSON.parse(event.data);

                // Find which band this scan belongs to based on frequency range
                const bandName = findBandForScan(scan);
                if (bandName && bandCanvases[bandName]) {
                    bandScans[bandName] = scan;
                    const { ctx, canvas, band } = bandCanvases[bandName];
                    drawSpectrumOnCanvas(ctx, canvas, scan, band);

                    // Update info display
                    const infoId = `info-${bandName.replace(/\s+/g, '-')}`;
                    const infoEl = document.getElementById(infoId);
                    if (infoEl) {
                        const points = scan.power ? scan.power.length : 0;
                        const minP = scan.power ? Math.min(...scan.power).toFixed(1) : '--';
                        const maxP = scan.power ? Math.max(...scan.power).toFixed(1) : '--';
                        infoEl.textContent = `${points} pts | ${minP} to ${maxP} dBm`;
                    }
                }
            };

            ws.onclose = () => {
                log('WebSocket disconnected');
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = (e) => {
                log('WebSocket error');
            };
        }

        function drawSpectrumOnCanvas(ctx, canvas, scan, band) {
            if (!ctx || !canvas) return;

            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const padding = { top: 20, right: 50, bottom: 30, left: 50 };
            const plotWidth = width - padding.left - padding.right;
            const plotHeight = height - padding.top - padding.bottom;

            // Clear canvas
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);

            // dB scale for spectrum analyzers
            const minDb = -110;
            const maxDb = -20;

            // Draw grid
            ctx.strokeStyle = '#1a1a3e';
            ctx.lineWidth = 1;

            // Horizontal grid lines (dB)
            const dbStep = 20;
            ctx.fillStyle = '#666';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'right';
            for (let db = minDb; db <= maxDb; db += dbStep) {
                const y = padding.top + plotHeight - ((db - minDb) / (maxDb - minDb)) * plotHeight;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
                ctx.fillText(`${db}`, padding.left - 5, y + 3);
            }

            // Use band frequency range for axis, or scan data if available
            const startMHz = (scan.power && scan.power.length > 0) ? scan.hz_lo / 1e6 : band.start_hz / 1e6;
            const stopMHz = (scan.power && scan.power.length > 0) ? scan.hz_hi / 1e6 : band.stop_hz / 1e6;
            const spanMHz = stopMHz - startMHz;

            // Vertical grid lines (frequency)
            const freqStep = spanMHz > 100 ? 20 : spanMHz > 50 ? 10 : spanMHz > 20 ? 5 : 2;
            ctx.textAlign = 'center';
            for (let f = Math.ceil(startMHz / freqStep) * freqStep; f <= stopMHz; f += freqStep) {
                const x = padding.left + ((f - startMHz) / spanMHz) * plotWidth;
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, height - padding.bottom);
                ctx.stroke();
                ctx.fillText(`${f}`, x, height - padding.bottom + 12);
            }

            // Draw spectrum line if we have data
            if (scan.power && scan.power.length > 0) {
                ctx.strokeStyle = '#00d4ff';
                ctx.lineWidth = 1;
                ctx.beginPath();

                const step = Math.max(1, Math.floor(scan.power.length / plotWidth));

                for (let i = 0; i < scan.power.length; i += step) {
                    const x = padding.left + (i / scan.power.length) * plotWidth;
                    const db = Math.max(minDb, Math.min(maxDb, scan.power[i]));
                    const y = padding.top + plotHeight - ((db - minDb) / (maxDb - minDb)) * plotHeight;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
            }
        }

        function reinitCanvases() {
            // Re-initialize all band canvases on resize
            for (const bandName in bandCanvases) {
                const { canvas, band } = bandCanvases[bandName];
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                bandCanvases[bandName].ctx = ctx;

                // Redraw with last scan data if available
                const scan = bandScans[bandName] || { power: [] };
                drawSpectrumOnCanvas(ctx, canvas, scan, band);
            }
        }

        // Initialize
        window.onload = () => {
            fetchStatus();
            fetchBands();
            fetchRadioInfo();
            setInterval(fetchStatus, 5000);

            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if (data.scanning) {
                        connectWebSocket();
                    }
                });
        };

        window.onresize = reinitCanvases;
    </script>
</body>
</html>
