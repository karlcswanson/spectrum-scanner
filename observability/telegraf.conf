# Telegraf — ships host + docker + mosquitto $SYS metrics to VictoriaMetrics
# (or any InfluxDB-line-protocol endpoint). Fully env-driven; see .env.example.
# No secrets or infra hostnames live in this file.
#
# NOTE: literal "$" in this config is written "$$" so Telegraf doesn't treat it
# as an env var — that's why the $SYS topics below are "$$SYS/...".

[agent]
  interval = "30s"
  flush_interval = "30s"
  hostname = "${TELEGRAF_HOSTNAME}"
  omit_hostname = false

# --- output: push to VictoriaMetrics /write (InfluxDB line protocol) -----------
# Telegraf POSTs to "<url>/write". Leave username/password empty for no auth.
[[outputs.influxdb]]
  urls = ["${VM_URL}"]
  username = "${VM_USERNAME}"
  password = "${VM_PASSWORD}"
  skip_database_creation = true

# --- host stats ---------------------------------------------------------------
[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "iso9660"]
[[inputs.diskio]]
[[inputs.net]]
[[inputs.system]]

# --- per-container stats (needs docker.sock, mounted read-only) ----------------
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  perdevice = false
  total = true

# --- Caddy HTTP metrics: request rate, status codes, latency, bytes served ----
# Scraped over the server docker network from Caddy's internal :2020 listener
# (never published to the host). Comment out this block if you don't run Caddy.
[[inputs.prometheus]]
  urls = ["${CADDY_METRICS_URL}"]
  metric_version = 2   # keep Prometheus metric names (caddy_http_requests_total, …)

# --- mosquitto broker health ($SYS): viewers, egress, message rates -----------
# Requires a read-only monitoring user on the broker (allow_anonymous=false) —
# see README.md for the one-time dynsec provisioning.
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_URL}"]
  username = "${MQTT_MONITOR_USERNAME}"
  password = "${MQTT_MONITOR_PASSWORD}"
  topics = [
    "$$SYS/broker/clients/connected",
    "$$SYS/broker/clients/active",
    "$$SYS/broker/load/bytes/sent/1min",
    "$$SYS/broker/load/bytes/received/1min",
    "$$SYS/broker/load/messages/sent/1min",
    "$$SYS/broker/subscriptions/count",
    "$$SYS/broker/heap/current",
  ]
  data_format = "value"
  data_type = "float"
  topic_tag = "topic"
